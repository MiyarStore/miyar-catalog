<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0;padding:0;font-family:monospace}.w{background:#fff;display:inline-block}.k{background:#000;display:inline-block}img{display:block}</style></head>
<body>
<div id="dim">loading</div>
<pre id="out" style="white-space:pre-wrap;word-break:break-all">pending</pre>
<div class="w"><img id="a" src="https://cdn.files.salla.network/other/1373650280/3834631f-2a9f-4e54-baa1-ab480b26a97d-original.webp"></div><br>
<div class="k"><img id="b" src="https://cdn.files.salla.network/other/1373650280/3834631f-2a9f-4e54-baa1-ab480b26a97d-original.webp"></div>
<script>
var a=document.getElementById('a');
a.onload=function(){document.getElementById('dim').textContent='DIM '+a.naturalWidth+'x'+a.naturalHeight;};
var c=new Image();c.crossOrigin='anonymous';
c.onload=function(){try{var cv=document.createElement('canvas');cv.width=c.naturalWidth;cv.height=c.naturalHeight;var x=cv.getContext('2d');x.drawImage(c,0,0);document.getElementById('out').textContent='DATA '+cv.toDataURL('image/png');}catch(e){document.getElementById('out').textContent='CORS-FAIL '+e;}};
c.onerror=function(){document.getElementById('out').textContent='LOAD-FAIL';};
c.src='https://cdn.files.salla.network/other/1373650280/3834631f-2a9f-4e54-baa1-ab480b26a97d-original.webp?cors=1';
</script>
</body></html>
